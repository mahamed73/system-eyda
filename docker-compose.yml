name: clinic-saas

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinic_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: clinic_saas
      TZ: Africa/Cairo
      PGTZ: Africa/Cairo
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_app -d clinic_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://clinic_app:${DB_PASSWORD}@db:5432/clinic_saas
      AUTH_SECRET: ${AUTH_SECRET}
      # في وضع الدومين: https://الدومين — في وضع الـ IP: الأكشن بيضبطه
      # من .env.docker على http://<IP> (override بورت 80).
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://${DOMAIN}}
      NODE_ENV: production
      TZ: Africa/Cairo
    volumes:
      - uploads_data:/app/storage/uploads

  # Caddy (SSL تلقائي) — بيشتغل فقط لما يكون فيه دومين (--profile web).
  # لما مفيش دومين بنشغّل app مباشرة على بورت 80 عبر البورت مابينج تحت
  # (تتم إضافته في الأكشن بـ override بسيط).
  caddy:
    image: caddy:2-alpine
    profiles: ["web"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  uploads_data:
  caddy_data:
  caddy_config:
